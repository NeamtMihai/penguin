<!DOCTYPE html>
<html lang="en">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<head>
    <meta charset="UTF-8" />
    <title>Club Penguin Mini</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /* UI BAR */
        #ui-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            padding: 0 10px;
            box-sizing: border-box;
        }

        #chat-input {
            flex: 1;
            height: 36px;
            border-radius: 6px;
            border: none;
            padding: 0 10px;
            font-size: 14px;
            outline: none;
        }

        #send-btn {
            margin-left: 10px;
            height: 36px;
            padding: 0 16px;
            border-radius: 6px;
            border: none;
            background: #00aaff;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        /* CHAT BUBBLE */
        .chat-bubble {
            position: absolute;
            background: white;
            border-radius: 10px;
            padding: 6px 10px;
            font-size: 44px;
            white-space: nowrap;
            transform: translate(-50%, -100%);
            pointer-events: none;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }

        #color-picker {
            display: flex;
            gap: 6px;
            margin-right: 10px;
        }

        .color-dot {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid white;
        }

        .color-dot[data-color="#0000ff"] {
            background: #0000ff;
        }

        .color-dot[data-color="#ff0000"] {
            background: #ff0000;
        }

        .color-dot[data-color="#00ff00"] {
            background: #00ff00;
        }

        .color-dot[data-color="#ffff00"] {
            background: #ffff00;
        }

        .color-dot[data-color="#ff00ff"] {
            background: #ff00ff;
        }

        #env-toggle {
            margin-right: 10px;
            height: 36px;
            padding: 0 12px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div id="auth-screen" style="
  position: fixed;
  inset: 0;
  background: linear-gradient(#87ceeb, #ffffff);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10;
">
  <div style="
    background: white;
    padding: 30px;
    border-radius: 12px;
    width: 300px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  ">
    <h2 style="margin-top:0;">🐧 Club Penguin Mini</h2>

    <input id="email" placeholder="Email"
      style="width:100%;margin-bottom:10px;padding:8px;" />

    <input id="password" type="password" placeholder="Password"
      style="width:100%;margin-bottom:10px;padding:8px;" />

    <button id="login-btn" style="width:100%;margin-bottom:8px;">
      Login
    </button>

    <button id="register-btn" style="width:100%;">
      Register
    </button>

    <p id="auth-error" style="color:red;"></p>
  </div>
</div>

    <!-- THREE.JS CANVAS IS ADDED BY JS -->

    <!-- CHAT BUBBLE CONTAINER -->
    <div id="chat-bubbles"></div>

    <!-- UI BAR -->
    <div id="ui-bar">
        <button id="env-toggle">Beach 🌴</button>
        <button id="event-toggle">Halloween 🎃</button>
        <button id="christmas-toggle">Christmas 🎄</button>

        <div id="color-picker">
            <div class="color-dot" data-color="#0000ff"></div>
            <div class="color-dot" data-color="#ff0000"></div>
            <div class="color-dot" data-color="#00ff00"></div>
            <div class="color-dot" data-color="#ffff00"></div>
            <div class="color-dot" data-color="#ff00ff"></div>
        </div>

        <input id="chat-input" type="text" placeholder="Say something..." />
        <button id="send-btn">Send</button>
    </div>

    <script type="module" src="main.js"></script>
</body>

</html>
