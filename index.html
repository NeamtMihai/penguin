<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Club Penguin Mini</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /* UI BAR */
        #ui-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            padding: 0 10px;
            box-sizing: border-box;
        }

        #chat-input {
            flex: 1;
            height: 36px;
            border-radius: 6px;
            border: none;
            padding: 0 10px;
            font-size: 14px;
            outline: none;
        }

        #send-btn {
            margin-left: 10px;
            height: 36px;
            padding: 0 16px;
            border-radius: 6px;
            border: none;
            background: #00aaff;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        /* CHAT BUBBLE */
        .chat-bubble {
            position: absolute;
            background: white;
            border-radius: 10px;
            padding: 6px 10px;
            font-size: 14px;
            white-space: nowrap;
            transform: translate(-50%, -100%);
            pointer-events: none;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }

        #color-picker {
            display: flex;
            gap: 6px;
            margin-right: 10px;
        }

        .color-dot {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid white;
        }

        .color-dot[data-color="#0000ff"] {
            background: #0000ff;
        }

        .color-dot[data-color="#ff0000"] {
            background: #ff0000;
        }

        .color-dot[data-color="#00ff00"] {
            background: #00ff00;
        }

        .color-dot[data-color="#ffff00"] {
            background: #ffff00;
        }

        .color-dot[data-color="#ff00ff"] {
            background: #ff00ff;
        }
    </style>
</head>

<body>
    <!-- THREE.JS CANVAS IS ADDED BY JS -->

    <!-- CHAT BUBBLE CONTAINER -->
    <div id="chat-bubbles"></div>

    <!-- UI BAR -->
    <div id="ui-bar">
        <div id="color-picker">
            <div class="color-dot" data-color="#0000ff"></div>
            <div class="color-dot" data-color="#ff0000"></div>
            <div class="color-dot" data-color="#00ff00"></div>
            <div class="color-dot" data-color="#ffff00"></div>
            <div class="color-dot" data-color="#ff00ff"></div>
        </div>

        <input id="chat-input" type="text" placeholder="Say something..." />
        <button id="send-btn">Send</button>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
